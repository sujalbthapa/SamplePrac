\u00a0 return x ** y\\n\\nprint(f(3))\\nprint(f(3, 3))\\nprint(f(y=4, x=2))\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"9\\n27\\n16\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"f(3) = 3\u00b2=9. f(3,3) = 3\u00b3=27. f(y=4, x=2) = 2\u2074=16. Keyword args allow out-of-order passing.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT005\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\na = [1, 2, 3, 4, 5]\\nprint(a[1:4])\\nprint(a[::-1])\\nprint(a[::2])\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"[2, 3, 4]\\n[5, 4, 3, 2, 1]\\n[1, 3, 5]\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"a[1:4] = indices 1,2,3 = [2,3,4]. a[::-1] reverses. a[::2] takes every second element starting from 0.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT006\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nclass A:\\n\u00a0 \u00a0 def __init__(self):\\n\u00a0 \u00a0 \u00a0 \u00a0 print('A init')\\n\\nclass B(A):\\n\u00a0 \u00a0 def __init__(self):\\n\u00a0 \u00a0 \u00a0 \u00a0 super().__init__()\\n\u00a0 \u00a0 \u00a0 \u00a0 print('B init')\\n\\nb = B()\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"A init\\nB init\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"B's __init__ calls super().__init__() first (A's __init__), printing 'A init', then continues to print 'B init'.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT007\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\ntry:\\n\u00a0 \u00a0 x = 1 / 0\\nexcept ZeroDivisionError:\\n\u00a0 \u00a0 print('Error')\\nfinally:\\n\u00a0 \u00a0 print('Finally')\\nprint('Done')\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"Error\\nFinally\\nDone\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"ZeroDivisionError is caught, prints 'Error'. finally always runs, prints 'Finally'. Then execution continues, prints 'Done'.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT008\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nresult = [x for x in range(10) if x % 2 == 0 if x % 3 == 0]\\nprint(result)\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"[0, 6]\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"Multiple if conditions in list comprehension act as AND. Numbers 0-9 divisible by both 2 and 3 are 0 and 6.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT009\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nd = {}\\nfor i in range(5):\\n\u00a0 \u00a0 d[i] = i ** 2\\nprint(d)\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"{0: 0, 1: 1, 2: 4, 3: 9, 4: 16}\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"The loop builds a dict where each key i maps to i squared: 0\u21920, 1\u21921, 2\u21924, 3\u21929, 4\u219216.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT010\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\ndef gen():\\n\u00a0 \u00a0 yield 1\\n\u00a0 \u00a0 yield 2\\n\u00a0 \u00a0 yield 3\\n\\ng = gen()\\nprint(next(g))\\nprint(next(g))\\nprint(list(g))\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"1\\n2\\n[3]\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"next(g) resumes the generator once each time. After consuming 1 and 2, list(g) exhausts the remaining values: [3].\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT011\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"C++\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output of the following C++ code?\\n\\n```cpp\\n#include <iostream>\\nint main() {\\n\u00a0 \u00a0 int x = 5;\\n\u00a0 \u00a0 std::cout << x++ << std::endl;\\n\u00a0 \u00a0 std::cout << ++x << std::endl;\\n\u00a0 \u00a0 std::cout << x-- << std::endl;\\n\u00a0 \u00a0 std::cout << x << std::endl;\\n\u00a0 \u00a0 return 0;\\n}\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"5\\n7\\n7\\n6\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"x++ returns 5 then x=6. ++x increments first to 7 then returns 7. x-- returns 7 then x=6. Final x=6.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT012\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nprint(type(1/2))\\nprint(type(1//2))\\nprint(1/2)\\nprint(1//2)\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"<class 'float'>\\n<class 'int'>\\n0.5\\n0\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"/ always returns float in Python 3. // is floor division, always returns int (for int inputs). 1/2=0.5, 1//2=0.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT013\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nfuncs = []\\nfor i in range(3):\\n\u00a0 \u00a0 funcs.append(lambda: i)\\n\\nfor f in funcs:\\n\u00a0 \u00a0 print(f())\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"2\\n2\\n2\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"Lambda captures i by reference (closure), not by value. After the loop, i=2, so all lambdas return 2. Use lambda i=i: i to fix.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT014\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\na = (1, 2, 3)\\nb = (4, 5, 6)\\nprint(a + b)\\nprint(a * 2)\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"(1, 2, 3, 4, 5, 6)\\n(1, 2, 3, 1, 2, 3)\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"Tuple + concatenates tuples into a new tuple. Tuple * n repeats the tuple n times.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT015\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"C++\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```cpp\\n#include <iostream>\\n#include <vector>\\nint main() {\\n\u00a0 \u00a0 std::vector<int> v = {1, 2, 3, 4, 5};\\n\u00a0 \u00a0 auto it = v.begin() + 2;\\n\u00a0 \u00a0 v.insert(it, 10);\\n\u00a0 \u00a0 for (auto x : v) std::cout << x << ' ';\\n\u00a0 \u00a0 return 0;\\n}\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"1 2 10 3 4 5\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"v.begin()+2 points to element at index 2 (value 3). Inserting 10 there shifts 3,4,5 to the right.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT016\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nprint('Hello'[1:4])\\nprint('Hello'[-1])\\nprint('Hello'[::-1])\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"ell\\no\\nolleH\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"'Hello'[1:4] = characters at indices 1,2,3 = 'ell'. [-1] = last character = 'o'. [::-1] reverses = 'olleH'.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT017\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\ndef outer():\\n\u00a0 \u00a0 x = 10\\n\u00a0 \u00a0 def inner():\\n\u00a0 \u00a0 \u00a0 \u00a0 nonlocal x\\n\u00a0 \u00a0 \u00a0 \u00a0 x += 5\\n\u00a0 \u00a0 \u00a0 \u00a0 return x\\n\u00a0 \u00a0 return inner\\n\\nf = outer()\\nprint(f())\\nprint(f())\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"15\\n20\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"nonlocal allows inner() to modify outer's x. The closure persists x between calls. First call: 10+5=15. Second: 15+5=20.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT018\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nprint(sorted([3,1,4,1,5,9,2,6], reverse=True))\\nprint(sorted(['banana', 'apple', 'cherry'], key=len))\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"[9, 6, 5, 4, 3, 2, 1, 1]\\n['apple', 'banana', 'cherry']\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"First: sorted in descending order. Second: sorted by string length (apple=5, banana=6, cherry=6) \u2014 tie-breaking preserves original order.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT019\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nfrom functools import reduce\\n\\nresult = reduce(lambda acc, x: acc + x, [1, 2, 3, 4, 5])\\nprint(result)\\n\\nresult2 = reduce(lambda acc, x: acc * x, [1, 2, 3, 4, 5])\\nprint(result2)\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"15\\n120\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"reduce applies function cumulatively. Sum: ((((1+2)+3)+4)+5)=15. Product: ((((1*2)*3)*4)*5)=120.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT020\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"C++\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```cpp\\n#include <iostream>\\nclass Base {\\npublic:\\n\u00a0 \u00a0 virtual void print() { std::cout << 'Base' << std::endl; }\\n};\\nclass Derived : public Base {\\npublic:\\n\u00a0 \u00a0 void print() override { std::cout << 'Derived' << std::endl; }\\n};\\nint main() {\\n\u00a0 \u00a0 Base* b = new Derived();\\n\u00a0 \u00a0 b->print();\\n\u00a0 \u00a0 delete b;\\n\u00a0 \u00a0 return 0;\\n}\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"Derived\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"Virtual function enables runtime polymorphism. b points to a Derived object, so Derived::print() is called via the vtable.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT021\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nclass MyClass:\\n\u00a0 \u00a0 def __str__(self):\\n\u00a0 \u00a0 \u00a0 \u00a0 return 'MyClass str'\\n\u00a0 \u00a0 def __repr__(self):\\n\u00a0 \u00a0 \u00a0 \u00a0 return 'MyClass repr'\\n\\nobj = MyClass()\\nprint(obj)\\nprint(repr(obj))\\nprint(f'{obj}')\\nprint(f'{obj!r}')\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"MyClass str\\nMyClass repr\\nMyClass str\\nMyClass repr\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"print() and f-strings call __str__. repr() and f'{obj!r}' call __repr__. The !r flag forces repr in f-strings.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT022\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nimport json\\ndata = {'name': 'Alice', 'scores': [95, 87, 92], 'active': True}\\njson_str = json.dumps(data)\\nparsed = json.loads(json_str)\\nprint(type(parsed['active']))\\nprint(type(parsed['scores']))\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"<class 'bool'>\\n<class 'list'>\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"JSON booleans map to Python bool, JSON arrays map to Python list, JSON objects to dict. Types are preserved through serialization.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT023\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\na = set([1, 2, 3, 4])\\nb = set([3, 4, 5, 6])\\nprint(a & b)\\nprint(a | b)\\nprint(a - b)\\nprint(a ^ b)\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"{3, 4}\\n{1, 2, 3, 4, 5, 6}\\n{1, 2}\\n{1, 2, 5, 6}\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"& = intersection, | = union, - = difference (in a but not b), ^ = symmetric difference (in one but not both).\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT024\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"C++\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```cpp\\n#include <iostream>\\n#include <string>\\nint main() {\\n\u00a0 \u00a0 std::string s = \\\"Hello World\\\";\\n\u00a0 \u00a0 std::cout << s.substr(6) << std::endl;\\n\u00a0 \u00a0 std::cout << s.find('o') << std::endl;\\n\u00a0 \u00a0 std::cout << s.length() << std::endl;\\n\u00a0 \u00a0 return 0;\\n}\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"World\\n4\\n11\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"substr(6) = from index 6 to end = 'World'. find('o') = first 'o' is at index 4. length() = 11 characters.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT025\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nfrom collections import Counter\\n\\ntext = 'mississippi'\\nc = Counter(text)\\nprint(c.most_common(3))\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"[('s', 4), ('i', 4), ('p', 2)]\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"Counter counts occurrences. 's' appears 4x, 'i' appears 4x, 'p' appears 2x. most_common(3) returns top 3.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT026\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nprint(all([True, True, True]))\\nprint(all([True, False, True]))\\nprint(any([False, False, False]))\\nprint(any([False, True, False]))\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"True\\nFalse\\nFalse\\nTrue\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"all() returns True only if ALL elements are truthy. any() returns True if AT LEAST ONE element is truthy.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT027\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\ndef decorator(func):\\n\u00a0 \u00a0 def wrapper(*args, **kwargs):\\n\u00a0 \u00a0 \u00a0 \u00a0 print('Before')\\n\u00a0 \u00a0 \u00a0 \u00a0 result = func(*args, **kwargs)\\n\u00a0 \u00a0 \u00a0 \u00a0 print('After')\\n\u00a0 \u00a0 \u00a0 \u00a0 return result\\n\u00a0 \u00a0 return wrapper\\n\\n@decorator\\ndef greet(name):\\n\u00a0 \u00a0 print(f'Hello, {name}!')\\n\u00a0 \u00a0 return 'done'\\n\\nval = greet('Alice')\\nprint(val)\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"Before\\nHello, Alice!\\nAfter\\ndone\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"The decorator wraps greet: prints 'Before', calls greet (prints 'Hello, Alice!'), prints 'After', returns 'done' which is printed.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT028\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\na = [1, 2, 3]\\nb = a.copy()\\nb.append(4)\\nprint(a)\\nprint(b)\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"[1, 2, 3]\\n[1, 2, 3, 4]\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"a.copy() creates a shallow copy \u2014 a new list object. Appending to b doesn't affect a.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT029\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"C++\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```cpp\\n#include <iostream>\\nint main() {\\n\u00a0 \u00a0 int arr[] = {10, 20, 30, 40, 50};\\n\u00a0 \u00a0 int* p = arr;\\n\u00a0 \u00a0 p += 2;\\n\u00a0 \u00a0 std::cout << *p << std::endl;\\n\u00a0 \u00a0 std::cout << *(p + 1) << std::endl;\\n\u00a0 \u00a0 std::cout << p[-1] << std::endl;\\n\u00a0 \u00a0 return 0;\\n}\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"30\\n40\\n20\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"p starts at arr[0]. p+=2 moves to arr[2]=30. *(p+1)=arr[3]=40. p[-1]=arr[1]=20 (pointer arithmetic).\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                },\n\u00a0 \u00a0 \u00a0 \u00a0 {\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"id\": \"OUT030\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"type\": \"output_finding\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"topic\": \"Python\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"question\": \"What is the output?\\n\\n```python\\nimport re\\n\\ntext = 'The price is $29.99 and $15.50'\\nprices = re.findall(r'\\\\$([0-9]+\\\\.[0-9]+)', text)\\nprint(prices)\\ntotal = sum(float(p) for p in prices)\\nprint(f'Total: ${total:.2f}')\\n```\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"answer\": \"['29.99', '15.50']\\nTotal: $45.49\",\n\u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \"explanation\": \"re.findall with capture group extracts just the number portion after $. Converting to float and summing: 29.99+15.50=45.49.\"\n\u00a0 \u00a0 \u00a0 \u00a0\n                }\n\u00a0 \u00a0 \u00a0\n            ]\n\u00a0 \u00a0\n        }\n\u00a0\n    },\n\u00a0 \"metadata\": {\n\u00a0 \u00a0 \"total_questions\": 200,\n\u00a0 \u00a0 \"mcq_count\": 70,\n\u00a0 \u00a0 \"code_writing_count\": 65,\n\u00a0 \u00a0 \"debugging_count\": 35,\n\u00a0 \u00a0 \"output_finding_count\": 30,\n\u00a0 \u00a0 \"topics_covered\": [\n            \"Python\",\n            \"C++\",\n            \"API Integration\",\n            \"AI/ML Concepts\",\n            \"Generative AI\",\n            \"LLMs\",\n            \"Coding Practices\"\n        ],\n\u00a0 \u00a0 \"difficulty_range\": \"Beginner to Intermediate\",\n\u00a0 \u00a0 \"context\": \"Alpinist Studios AI Intern Written Test\"\n\u00a0\n    }\n}";
                let jsonText = cleanJSONString(rawData);
                const data = JSON.parse(jsonText);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('loaded-controls').style.display = 'block';
                renderTest(data);
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('test-content').innerHTML = `<div style="color:red; text-align:center; padding: 40px; background: #fee2e2; border-radius: 8px; border: 1px solid #fca5a5;"><h3>Failed to parse hardcoded JSON</h3><p>${escapeHTML(e.message)}</p></div>`;
            }
        }

        // Main Rendering Logic
        function renderTest(data) {
            let html = `
                <div class="header">
                    <h1>${escapeHTML(data.title)}</h1>
                    <h2>${escapeHTML(data.company)}</h2>
                    <div class="meta-tags">
                        <span class="meta-tag">Total Questions: ${escapeHTML(data.metadata?.total_questions || Object.values(data.sections || {}).reduce((acc, curr) => acc + (curr.questions?.length || 0), 0) + ' Questions')}</span>
                        <span class="meta-tag">Difficulty: ${escapeHTML(data.metadata?.difficulty_range || 'N/A')}</span>
                    </div>
                </div>
            `;

            if (data.sections) {
                for (const [sectionKey, sectionData] of Object.entries(data.sections)) {
                    html += `
                        <div class="section-container">
                            <h2 class="section-title">${escapeHTML(sectionData.description)}</h2>
                    `;
                    
                    if (sectionData.questions) {
                        sectionData.questions.forEach((q, index) => {
                            html += `
                                <div class="question-card">
                                    <span class="topic-badge">${escapeHTML(q.topic || sectionKey)}</span>
                                    <div class="question-text"><strong>Q${index + 1}:</strong> ${formatText(q.question)}</div>
                            `;

                            // Render specific types
                            if (q.type === 'mcq' || sectionKey === 'mcq') {
                                html += `<ul class="options">`;
                                if (q.options) {
                                    for (const [optKey, optVal] of Object.entries(q.options)) {
                                        html += `<li data-key="${escapeHTML(optKey)}" onclick="selectOption(this, '${escapeHTML(optKey)}', '${escapeHTML(q.answer)}')"><strong>${escapeHTML(optKey)}:</strong> ${formatText(optVal)}</li>`;
                                    }
                                }
                                html += `</ul>`;
                                html += `
                                    <details>
                                        <summary>View Answer & Explanation</summary>
                                        <div class="answer-content">
                                            <div class="correct-answer">Correct Answer: ${escapeHTML(q.answer)}</div>
                                            <div class="explanation"><strong>Explanation:</strong><br>${formatText(q.explanation)}</div>
                                        </div>
                                    </details>
                                `;
                            } 
                            else if (q.type === 'code_writing' || sectionKey === 'code_writing') {
                                html += `
                                    <details>
                                        <summary>View Solution Code</summary>
                                        <div class="answer-content">
                                            ${formatCode(q.answer?.code, q.answer?.language)}
                                        </div>
                                    </details>
                                `;
                            } 
                            else if (q.type === 'debugging' || sectionKey === 'debugging') {
                                html += `
                                    <details>
                                        <summary>View Bug Identification & Fix</summary>
                                        <div class="answer-content">
                                            <div class="bug-label">Identified Bug:</div>
                                            <div class="explanation" style="border-left-color: var(--danger);">${formatText(q.bug)}</div>
                                            <div class="correct-answer" style="margin-top:15px;">Solution Explanation:</div>
                                            <div class="explanation">${formatText(q.answer?.explanation)}</div>
                                            <div style="margin-top: 15px; font-weight: bold; color: var(--success);">Fixed Code:</div>
                                            ${formatCode(q.answer?.fixed_code, 'python')}
                                        </div>
                                    </details>
                                `;
                            } 
                            else if (q.type === 'output_finding' || sectionKey === 'output_finding') {
                                html += `
                                    <details>
                                        <summary>View Execution Output</summary>
                                        <div class="answer-content">
                                            <div class="correct-answer">Expected Output:</div>
                                            ${formatCode(q.answer, 'plaintext')}
                                            <div class="explanation" style="margin-top:15px;"><strong>Explanation:</strong><br>${formatText(q.explanation)}</div>
                                        </div>
                                    </details>
                                `;
                            }
                            
                            html += `</div>`; // Close question-card
                        });
                    }
                    html += `</div>`; // Close section
                }
            }

            document.getElementById('test-content').innerHTML = html;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadTest);
    </script>
